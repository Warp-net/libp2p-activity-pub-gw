services:
  fediverse-gateway:
    container_name: fediverse-gateway-mainnet
    image: ghcr.io/warp-net/warpnet-gateway:latest
    restart: always
    # No network_mode host (unlike testnet): both gateways share the droplet and
    # the testnet one already holds the libp2p :4040. Its own namespace is enough
    # — inbound arrives via the network's relays and Tailscale Funnel — so only
    # /logs is published: http://<host>:4081/logs (:4080 is the testnet's).
    ports:
      - "4081:4080"
    environment:
      # Join the Warpnet MAINNET — bootstrap peers are baked into the gateway.
      - NODE_NETWORK=warpnet
      - GATEWAY_LOGS_TOKEN=${GATEWAY_LOGS_TOKEN:-}
      # Standalone plain-HTTP /logs listener, published as :4081 above and still
      # gated by the token. Leave empty to disable.
      - GATEWAY_LOGS_ADDR=${GATEWAY_LOGS_ADDR:-:4080}
      # Public HTTPS via embedded Tailscale Funnel (no domain, no cert mgmt).
      # Provide TS_AUTHKEY as a CI secret; the *.ts.net hostname derives from
      # GATEWAY_FUNNEL_HOSTNAME and stays stable thanks to the /data volume.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - GATEWAY_FUNNEL_HOSTNAME=warpnet-gw
    volumes:
      # Persists the RSA signing key and Tailscale identity. Separate from the
      # testnet dir: a shared one would collide on both.
      - /root/.warpnet-gateway-mainnet:/data:rw
