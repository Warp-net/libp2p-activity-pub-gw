services:
  fediverse-gateway:
    container_name: fediverse-gateway-mainnet
    image: ghcr.io/warp-net/warpnet-gateway:latest
    restart: always
    # No network_mode host (unlike testnet): this container holds a libp2p node
    # per network (:4040 mainnet, :4041 testnet) and the testnet-only deployment
    # already binds :4040 on the droplet. Its own namespace keeps them apart —
    # inbound arrives via the networks' relays and Tailscale Funnel, so nothing
    # else needs publishing: http://<host>:4081/logs (:4080 is the testnet's).
    ports:
      - "4081:4080"
    environment:
      # Join MAINNET and TESTNET at once — one libp2p node each, in this one
      # process, behind the single ActivityPub host. Bootstrap peers for both are
      # baked into the gateway; a user is resolved on whichever network has them.
      - NODE_NETWORK=warpnet,testnet
      # Per-node off switches: set either to true to take that node out without
      # touching NODE_NETWORK (e.g. GATEWAY_DISABLE_TESTNET=true docker compose
      # ... up -d). Empty leaves the node running.
      - GATEWAY_DISABLE_WARPNET=${GATEWAY_DISABLE_WARPNET:-}
      - GATEWAY_DISABLE_TESTNET=${GATEWAY_DISABLE_TESTNET:-}
      - GATEWAY_LOGS_TOKEN=${GATEWAY_LOGS_TOKEN:-}
      # Standalone plain-HTTP /logs listener, published as :4081 above and still
      # gated by the token. Leave empty to disable.
      - GATEWAY_LOGS_ADDR=${GATEWAY_LOGS_ADDR:-:4080}
      # Public HTTPS via embedded Tailscale Funnel (no domain, no cert mgmt).
      # Provide TS_AUTHKEY as a CI secret; the *.ts.net hostname derives from
      # GATEWAY_FUNNEL_HOSTNAME and stays stable thanks to the /data volume.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - GATEWAY_FUNNEL_HOSTNAME=warpnet-gw
    volumes:
      # Persists the RSA signing key and Tailscale identity. Separate from the
      # testnet dir: a shared one would collide on both.
      - /root/.warpnet-gateway-mainnet:/data:rw
